<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      width: 1080px;
      background: #020503;
      color: #1cff31;
      padding: 20px;
      font-family: "Menlo", "Monaco", "Consolas", "Courier New", monospace;
    }
    .screen {
      position: relative;
      overflow: hidden;
      min-height: 0;
      border: 2px solid #10f725;
      background:
        linear-gradient(rgba(28, 255, 49, 0.045) 1px, transparent 1px),
        radial-gradient(circle at 50% 16%, rgba(28, 255, 49, 0.18), transparent 28%),
        linear-gradient(180deg, #020503 0%, #021306 52%, #020503 100%);
      background-size: 100% 6px, 100% 100%, 100% 100%;
      padding: 20px;
      box-shadow: inset 0 0 42px rgba(28, 255, 49, 0.16);
    }
    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(28, 255, 49, 0.05), transparent);
      opacity: 0.7;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid #10f725;
      font-size: 13px;
      letter-spacing: 1px;
      font-weight: 900;
    }
    .nav {
      display: flex;
      gap: 24px;
      color: rgba(28, 255, 49, 0.62);
      font-size: 11px;
    }
    .hero {
      padding: 50px 32px 36px;
      text-align: center;
      border-bottom: 1px solid #10f725;
    }
    h1 {
      margin: 0;
      color: #20ff38;
      font-size: 52px;
      line-height: 1;
      letter-spacing: 0;
      font-weight: 950;
      text-shadow: 0 0 18px rgba(28, 255, 49, 0.45);
      white-space: nowrap;
    }
    .prompt {
      margin-top: 24px;
      color: rgba(28, 255, 49, 0.82);
      font-size: 16px;
      font-style: italic;
      font-weight: 800;
    }
    .subtitle {
      max-width: 820px;
      margin: 18px auto 0;
      color: #b9ffc0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 22px;
      line-height: 1.5;
      font-weight: 650;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 22px 0;
    }
    .metric {
      min-width: 0;
      border: 1px solid rgba(28, 255, 49, 0.72);
      background: rgba(28, 255, 49, 0.08);
      padding: 14px 12px;
    }
    .metric strong {
      display: block;
      color: #20ff38;
      font-size: 24px;
      line-height: 1.1;
      font-weight: 950;
      overflow-wrap: anywhere;
    }
    .metric span {
      display: block;
      margin-top: 6px;
      color: #a4f7ab;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 650;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 16px;
    }
    .panel {
      border: 1px solid rgba(28, 255, 49, 0.72);
      background: rgba(0, 12, 3, 0.68);
      padding: 16px;
    }
    .section {
      padding: 0 0 14px;
      border-bottom: 1px dashed rgba(28, 255, 49, 0.42);
      margin-bottom: 14px;
    }
    .section:last-child {
      border-bottom: 0;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    h2 {
      margin: 0 0 6px;
      color: #20ff38;
      font-size: 17px;
      line-height: 1.3;
      font-weight: 950;
    }
    p {
      margin: 0;
      color: #b9ffc0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      font-weight: 620;
      overflow-wrap: anywhere;
    }
    ul {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    li {
      position: relative;
      padding-left: 20px;
      color: #b9ffc0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 650;
      overflow-wrap: anywhere;
    }
    li::before {
      content: ">";
      position: absolute;
      left: 0;
      top: 0;
      color: #20ff38;
      font-family: "Menlo", "Monaco", "Consolas", monospace;
      font-weight: 950;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .tag {
      border: 1px solid rgba(28, 255, 49, 0.7);
      color: #20ff38;
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 900;
    }
    .brand {
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid #10f725;
      color: rgba(185, 255, 192, 0.78);
      font-size: 14px;
      line-height: 1.4;
      text-align: right;
      font-weight: 800;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="topbar">
      <span>ZERO_API_IMAGE_OS</span>
      <div class="nav"><span>HTML</span><span>SCREENSHOT</span><span>TEMPLATE</span><span>PNG</span></div>
    </div>

    <section class="hero">
      <h1>&gt; $title</h1>
      <div class="prompt">root@zero-api:~# cat skill_manifest.txt</div>
      <div class="subtitle">$subtitle</div>
    </section>

    <section class="metrics">$metrics_html</section>

    <section class="grid">
      <div class="panel">$sections_html</div>
      <div class="panel">
        <h2>RUNBOOK</h2>
        <ul>$items_html</ul>
        <div class="tags">$tags_html</div>
      </div>
    </section>

    <div class="brand">$brand</div>
  </main>
</body>
</html>
