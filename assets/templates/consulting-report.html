<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      width: 1080px;
      padding: 58px;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #182234;
      background: #f5f7fa;
    }
    .sheet {
      background: #ffffff;
      border: 1px solid #cfd6e3;
      padding: 48px;
    }
    .kicker {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid #182234;
      padding-bottom: 18px;
      color: #5e6878;
      font-size: 20px;
      font-weight: 800;
    }
    h1 {
      margin: 42px 0 18px;
      max-width: 760px;
      font-size: 50px;
      line-height: 1.18;
      letter-spacing: 0;
      font-weight: 900;
      overflow-wrap: anywhere;
    }
    .subtitle {
      max-width: 790px;
      color: #5e6878;
      font-size: 25px;
      line-height: 1.52;
      margin-bottom: 34px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-top: 1px solid #cfd6e3;
      border-bottom: 1px solid #cfd6e3;
      margin-bottom: 34px;
    }
    .metric {
      min-width: 0;
      padding: 24px 18px;
      border-right: 1px solid #cfd6e3;
    }
    .metric:last-child { border-right: 0; }
    .metric strong {
      display: block;
      color: #0f766e;
      font-size: 39px;
      line-height: 1.1;
      font-weight: 900;
      overflow-wrap: anywhere;
    }
    .metric span {
      display: block;
      margin-top: 8px;
      color: #5e6878;
      font-size: 18px;
      line-height: 1.32;
      font-weight: 700;
    }
    .sections {
      display: grid;
      gap: 0;
      border-top: 1px solid #cfd6e3;
    }
    .section {
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 24px;
      padding: 24px 0;
      border-bottom: 1px solid #cfd6e3;
    }
    h2 {
      margin: 0;
      color: #182234;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 850;
    }
    p {
      margin: 0;
      color: #344256;
      font-size: 23px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    ul {
      display: grid;
      gap: 12px;
      margin: 30px 0 0;
      padding: 0;
      list-style: none;
    }
    li {
      padding: 14px 0;
      border-bottom: 1px solid #e4e8ef;
      font-size: 23px;
      line-height: 1.42;
      overflow-wrap: anywhere;
    }
    .brand {
      margin-top: 36px;
      color: #5e6878;
      font-size: 20px;
      font-weight: 800;
      text-align: right;
    }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="kicker"><span>$eyebrow</span><span>CONFIDENTIAL NOTE</span></div>
    <h1>$title</h1>
    <div class="subtitle">$subtitle</div>
    <section class="metrics">$metrics_html</section>
    <section class="sections">$sections_html</section>
    <ul>$items_html</ul>
    <div class="brand">$brand</div>
  </main>
</body>
</html>
