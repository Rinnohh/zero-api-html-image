<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      width: 1080px;
      background: #6b3f24;
      color: #3b1f10;
      padding: 34px;
      font-family: "Menlo", "Monaco", "Consolas", "Courier New", monospace;
      image-rendering: pixelated;
    }
    .scene {
      min-height: 1040px;
      border: 6px solid #2c170d;
      background:
        repeating-linear-gradient(90deg, #b97538 0 30px, #8a502a 30px 35px, #c98541 35px 64px),
        #a96432;
      box-shadow: 10px 10px 0 #2c170d;
      padding: 34px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 42px;
    }
    .hud-box {
      border: 5px solid #2c170d;
      background: #e7b56f;
      box-shadow: 5px 5px 0 #2c170d;
      padding: 13px 18px;
      color: #4b2815;
      font-size: 16px;
      line-height: 1.1;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #f7d38b;
    }
    .sign {
      max-width: 850px;
      margin: 0 auto 34px;
      text-align: center;
      border: 7px solid #3b1f10;
      background:
        repeating-linear-gradient(0deg, rgba(95,51,24,.14) 0 3px, transparent 3px 22px),
        linear-gradient(#edc27a, #d99a55);
      box-shadow: 8px 8px 0 #2c170d, inset 0 0 0 5px #f7d696;
      padding: 32px 42px 30px;
      position: relative;
    }
    .sign::before, .sign::after {
      content: "";
      position: absolute;
      top: 16px;
      width: 24px;
      height: 24px;
      border: 5px solid #4b2815;
      background: #c87a3a;
    }
    .sign::before { left: 18px; }
    .sign::after { right: 18px; }
    h1 {
      margin: 0;
      color: #6a3218;
      font-family: "Menlo", "Monaco", "Consolas", "Courier New", "PingFang SC", monospace;
      font-size: 50px;
      line-height: 1.15;
      font-weight: 950;
      letter-spacing: 1px;
      text-shadow:
        3px 0 0 #f7d38b,
        0 3px 0 #f7d38b,
        4px 4px 0 rgba(44,23,13,0.42);
      overflow-wrap: anywhere;
    }
    .subtitle {
      margin: 18px auto 0;
      color: #5a2d16;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 23px;
      line-height: 1.55;
      font-weight: 760;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin: 30px 0 34px;
    }
    .metric {
      min-width: 0;
      border: 5px solid #3b1f10;
      background: #f6d38f;
      padding: 17px 13px;
      box-shadow: 5px 5px 0 #2c170d, inset 0 0 0 3px #fff0b8;
    }
    .metric strong {
      display: block;
      color: #2e7a2d;
      font-size: 29px;
      line-height: 1.08;
      font-weight: 950;
      overflow-wrap: anywhere;
    }
    .metric span {
      display: block;
      margin-top: 8px;
      color: #5a2d16;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.34;
      font-weight: 760;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }
    .panel {
      border: 6px solid #3b1f10;
      background: #f4c97f;
      padding: 24px;
      box-shadow: 7px 7px 0 #2c170d, inset 0 0 0 4px #fff0b8;
    }
    .section {
      padding: 16px 0;
      border-bottom: 4px solid #b36b34;
    }
    .section:first-child { padding-top: 0; }
    .section:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }
    h2 {
      margin: 0 0 8px;
      color: #6a3218;
      font-size: 20px;
      line-height: 1.28;
      font-weight: 950;
      text-shadow: 2px 2px 0 #f7d38b;
    }
    p, li {
      color: #4a2412;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 18px;
      line-height: 1.55;
      font-weight: 720;
      overflow-wrap: anywhere;
    }
    p { margin: 0; }
    ul {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
      border: 4px solid #3b1f10;
      background: #f8dca2;
    }
    li {
      position: relative;
      padding: 16px 16px 16px 46px;
      border-bottom: 3px solid #b36b34;
    }
    li:last-child { border-bottom: 0; }
    li::before {
      content: "";
      position: absolute;
      left: 16px;
      top: 22px;
      width: 14px;
      height: 14px;
      background: #d94f2a;
      border: 3px solid #3b1f10;
      box-shadow: 3px 3px 0 #3b1f10;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .tag {
      border: 4px solid #3b1f10;
      background: #7fc756;
      color: #2c170d;
      padding: 8px 11px;
      font-size: 13px;
      line-height: 1;
      font-weight: 950;
      box-shadow: 3px 3px 0 #2c170d;
      text-transform: uppercase;
    }
    .brand {
      margin-top: 30px;
      color: #fff0b8;
      font-size: 16px;
      font-weight: 950;
      text-align: right;
      text-shadow: 2px 2px 0 #2c170d;
      overflow-wrap: anywhere;
    }
    .brand:empty { display: none; }
  </style>
</head>
<body>
  <main class="scene">
    <div class="hud">
      <div class="hud-box">$eyebrow</div>
      <div class="hud-box">DAY 18 · SUNNY · LV. 11</div>
    </div>

    <section class="sign">
      <h1>$title</h1>
      <div class="subtitle">$subtitle</div>
    </section>

    <section class="metrics">$metrics_html</section>

    <section class="grid">
      <div class="panel">$sections_html</div>
      <div class="panel">
        <h2>任务菜单</h2>
        <ul>$items_html</ul>
        <div class="tags">$tags_html</div>
      </div>
    </section>

    <div class="brand">$brand</div>
  </main>
</body>
</html>
