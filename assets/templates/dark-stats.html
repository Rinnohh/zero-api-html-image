<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      width: 1080px;
      background: #0d0d0d;
      padding: 60px;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #f8fafc;
    }
    .card {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 58px 58px 50px;
    }
    .label {
      display: inline-flex;
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.35);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 20px;
      font-weight: 750;
      margin-bottom: 26px;
    }
    h1 {
      margin: 0;
      max-width: 100%;
      color: #ffffff;
      font-size: 39px;
      line-height: 1.16;
      letter-spacing: 0;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
    }
    .subtitle {
      margin: 22px 0 38px;
      color: #b7c0ca;
      font-size: 27px;
      line-height: 1.52;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin: 0 0 30px;
    }
    .stat-box {
      min-width: 0;
      padding: 26px;
      background: #1b1b1b;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
    }
    .stat {
      color: #4ade80;
      font-size: 48px;
      line-height: 1.1;
      font-weight: 850;
      overflow-wrap: anywhere;
    }
    .stat-label {
      margin-top: 12px;
      color: #cbd5e1;
      font-size: 23px;
      line-height: 1.35;
    }
    .bullets {
      display: grid;
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .bullets li {
      color: #e5e7eb;
      font-size: 25px;
      line-height: 1.45;
      padding-left: 24px;
      position: relative;
      overflow-wrap: anywhere;
    }
    .bullets li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 16px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }
    .tag {
      color: #d1fae5;
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.25);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 20px;
      font-weight: 650;
    }
    .brand {
      margin-top: 34px;
      padding: 18px 20px 0;
      border-top: 1px solid #2a2a2a;
      color: #cbd5e1;
      font-size: 21px;
      line-height: 1.45;
      font-weight: 750;
      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="label">$eyebrow</div>
    <h1>$title</h1>
    <div class="subtitle">$subtitle</div>
    <section class="stats">$stats_html</section>
    <ul class="bullets">$items_html</ul>
    <div class="tags">$tags_html</div>
    <div class="brand">$brand</div>
  </main>
</body>
</html>
