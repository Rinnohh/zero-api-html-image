<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      width: 1080px;
      padding: 56px;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #ecfeff;
      background:
        linear-gradient(145deg, rgba(13, 24, 37, 0.98), rgba(7, 13, 22, 0.98)),
        #0d1825;
    }
    .frame {
      border: 1px solid rgba(103, 232, 249, 0.32);
      padding: 40px;
      background:
        linear-gradient(rgba(103, 232, 249, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(103, 232, 249, 0.07) 1px, transparent 1px),
        rgba(8, 16, 28, 0.86);
      background-size: 36px 36px;
    }
    .eyebrow {
      color: #67e8f9;
      font-size: 22px;
      font-weight: 850;
      letter-spacing: 0;
      margin-bottom: 42px;
    }
    h1 {
      margin: 0;
      max-width: 850px;
      font-size: 58px;
      line-height: 1.08;
      letter-spacing: 0;
      font-weight: 920;
      overflow-wrap: anywhere;
    }
    .subtitle {
      margin: 22px 0 34px;
      max-width: 780px;
      color: #b7d7df;
      font-size: 28px;
      line-height: 1.48;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .metric {
      min-width: 0;
      padding: 24px;
      border: 1px solid rgba(103, 232, 249, 0.3);
      background: rgba(103, 232, 249, 0.08);
    }
    .metric strong {
      display: block;
      color: #67e8f9;
      font-size: 45px;
      line-height: 1.1;
      font-weight: 920;
      overflow-wrap: anywhere;
    }
    .metric span {
      display: block;
      margin-top: 8px;
      color: #b7d7df;
      font-size: 20px;
      line-height: 1.35;
    }
    ul {
      display: grid;
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    li {
      color: #e0f7fa;
      border-left: 4px solid #67e8f9;
      background: rgba(236, 254, 255, 0.06);
      padding: 18px 20px;
      font-size: 25px;
      line-height: 1.42;
      overflow-wrap: anywhere;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 26px;
    }
    .tag {
      color: #ecfeff;
      border: 1px solid rgba(103, 232, 249, 0.36);
      background: rgba(103, 232, 249, 0.1);
      padding: 9px 14px;
      font-size: 20px;
      font-weight: 760;
    }
    .brand {
      margin-top: 30px;
      color: #67e8f9;
      font-size: 21px;
      font-weight: 850;
      text-align: right;
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="eyebrow">TECH POSTER</div>
    <h1>把浏览器变成稳定的视觉渲染引擎</h1>
    <div class="subtitle">适合技术文章、产品发布、自动化工作流和工程向内容传播。</div>
    <section class="metrics"><div class="metric"><strong>HTML</strong><span>结构层</span></div>
<div class="metric"><strong>CSS</strong><span>视觉层</span></div></section>
    <ul><li>布局、字号、间距和对齐全部可控。</li>
<li>本地渲染，无需图片生成接口。</li>
<li>模板扩展后可批量生成系列海报。</li></ul>
    <div class="tags"><span class="tag">Browser</span>
<span class="tag">Screenshot</span>
<span class="tag">Automation</span></div>
    <div class="brand">tech-poster</div>
  </main>
</body>
</html>
